name: Validate Murmur source

on:
  pull_request:
  push:
    branches:
      - main
      - "murmur/**"
      - "chore/**"

permissions:
  contents: read

jobs:
  syntax-and-json:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            echo "Checking $file"
            node --check --input-type=module < "$file"
          done < <(find . -type f -name '*.js' -not -path './.git/*' -print0)

      - name: Validate HTML IDs and local assets
        run: node scripts/validate-html.mjs

      - name: Validate JSON files
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            echo "Checking $file"
            node -e 'JSON.parse(require("node:fs").readFileSync(process.argv[1], "utf8"))' "$file"
          done < <(find . -type f -name '*.json' -not -path './.git/*' -print0)
