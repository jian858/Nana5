name: Murmur Supabase architecture guard

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  architecture-guard:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Enforce Supabase-only live entrypoint
        shell: bash
        run: |
          set -euo pipefail

          for required in 'supabase-client.js' 'supabase-runtime.js' 'supabase-app.js'; do
            grep -Fq "$required" index.html || {
              echo "Missing required Supabase startup module: $required"
              exit 1
            }
          done

          if grep -Ein 'firebase(app|auth|database|storage|functions)|firebaseio\.com|firebase\.googleapis\.com' index.html; then
            echo "Firebase SDK or Firebase service reference found in the live HTML entrypoint."
            exit 1
          fi

      - name: Prevent Firebase from entering live Supabase modules
        shell: bash
        run: |
          set -euo pipefail
          files=(supabase-client.js supabase-runtime.js supabase-data.js supabase-app.js supabase-social.js visitor-tracking.js)
          if grep -Ein 'firebase(app|auth|database|storage|functions)|firebaseio\.com|firebase\.googleapis\.com|firebase-admin' "${files[@]}"; then
            echo "Firebase reference found in an active application module."
            exit 1
          fi

      - name: Prevent server secrets in browser modules
        shell: bash
        run: |
          set -euo pipefail
          files=(supabase-client.js supabase-runtime.js supabase-data.js supabase-app.js supabase-social.js visitor-tracking.js)
          if grep -Ein 'service_role|sb_secret_[A-Za-z0-9_-]{12,}|-----BEGIN (RSA |EC )?PRIVATE KEY-----' "${files[@]}"; then
            echo "A server-only secret pattern was found in a browser module."
            exit 1
          fi

      - name: Check migration naming and content basics
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          migrations=(supabase/migrations/*.sql)
          if (("${#migrations[@]}" == 0)); then
            echo "No Supabase SQL migrations found."
            exit 1
          fi
          for migration in "${migrations[@]}"; do
            [[ "$(basename "$migration")" =~ ^[0-9]{14}_[a-z0-9_]+\.sql$ ]] || {
              echo "Migration filename must use a 14-digit timestamp and snake_case: $migration"
              exit 1
            }
          done
