<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <meta name="theme-color" content="#14c8a0">
  <title>Reset password | Murmur</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:22px;background:#f3f7f8;color:#172332;font:16px system-ui,-apple-system,Segoe UI,sans-serif}
    main{width:min(100%,440px);padding:30px;border:1px solid #e3e9ec;border-radius:20px;background:#fff;box-shadow:0 18px 55px #142b3a12}
    h1{margin:0 0 8px;font-size:26px}p{color:#607080;line-height:1.55}label{display:block;margin:18px 0 7px;font-weight:650}
    input{width:100%;padding:13px;border:1px solid #ccd6dc;border-radius:10px;font:inherit}
    button{width:100%;margin-top:22px;padding:14px;border:0;border-radius:10px;background:#14a987;color:white;font:inherit;font-weight:750}
    button:disabled{opacity:.55}#message{min-height:24px;margin-top:14px;font-size:14px}a{color:#087d69}
  </style>
  <script src="/config.js"></script>
</head>
<body>
<main>
  <h1>Choose a new password</h1>
  <p id="intro">Verifying your secure password-reset link…</p>
  <form id="form" hidden>
    <label for="password">New password</label>
    <input id="password" type="password" minlength="8" autocomplete="new-password" required>
    <label for="confirm">Confirm new password</label>
    <input id="confirm" type="password" minlength="8" autocomplete="new-password" required>
    <button id="submit" type="submit">Change password</button>
  </form>
  <p id="message" role="status" aria-live="polite"></p>
  <p><a href="/">Return to Murmur</a></p>
</main>
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import { getAuth, verifyPasswordResetCode, confirmPasswordReset, signInWithEmailAndPassword, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
  import { getDatabase, ref, set } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

  const intro=document.getElementById("intro"), form=document.getElementById("form");
  const message=document.getElementById("message"), submit=document.getElementById("submit");
  const params=new URLSearchParams(location.search), mode=params.get("mode"), code=params.get("oobCode");
  let email="";
  const app=initializeApp(window.MURMUR_FIREBASE);
  const auth=getAuth(app), db=getDatabase(app);

  function explain(error){
    const code=error?.code||"";
    if(code==="auth/expired-action-code"||code==="auth/invalid-action-code") return "This reset link has expired or was already used. Request a new password-reset email.";
    if(code==="auth/weak-password") return "Choose a stronger password with at least 8 characters.";
    if(code==="auth/network-request-failed") return "Network connection failed. Check your connection and try again.";
    return "We could not complete the password reset. Request a new link and try again.";
  }

  if(mode!=="resetPassword"||!code){
    intro.textContent="This password-reset link is incomplete.";
    message.textContent="Return to Murmur and request a new reset email.";
  } else {
    try{
      email=await verifyPasswordResetCode(auth,code);
      intro.textContent="Resetting the password for "+email+". Your other signed-in devices will lose database access.";
      form.hidden=false;
    }catch(error){intro.textContent=explain(error);}
  }

  form.addEventListener("submit",async event=>{
    event.preventDefault();
    const password=document.getElementById("password").value;
    const confirm=document.getElementById("confirm").value;
    if(password.length<8){message.textContent="Use at least 8 characters.";return;}
    if(password!==confirm){message.textContent="The passwords do not match.";return;}
    submit.disabled=true;submit.textContent="Updating password…";message.textContent="";
    try{
      await confirmPasswordReset(auth,code,password);
      const credential=await signInWithEmailAndPassword(auth,email,password);
      const token=await credential.user.getIdTokenResult(true);
      const authTime=Number(token.claims.auth_time);
      if(!Number.isFinite(authTime)||authTime<=0) throw new Error("Could not verify the new sign-in time.");
      // The rule only accepts the auth_time embedded in this freshly issued token
      // and prevents the marker from ever moving backwards.
      await set(ref(db,"security/"+credential.user.uid),{minAuthTime:authTime});
      await signOut(auth);
      form.hidden=true;
      intro.textContent="Your password has been changed.";
      message.textContent="Previous Murmur sessions are now blocked. Sign in again on this device with your new password.";
      submit.textContent="Password changed";
    }catch(error){
      message.textContent=explain(error);
      submit.disabled=false;submit.textContent="Change password";
    }
  });
</script>
</body>
</html>
